<svg xmlns="http://www.w3.org/2000/svg" width="440" height="570" viewBox="0 0 440 570" role="img" aria-labelledby="title"><title id="title">Sukumar Muthusamy. RAG, multi-agent systems, agent orchestration, and explainable AI.</title><defs>
