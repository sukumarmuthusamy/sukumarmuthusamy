<svg xmlns="http://www.w3.org/2000/svg" width="440" height="395" viewBox="0 0 440 395" role="img" aria-labelledby="title"><title id="title">Sukumar Muthusamy. AI engineering and quality engineering. RAG, agents, and explainable AI.</title><defs>
